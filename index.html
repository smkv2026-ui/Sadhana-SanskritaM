    <script>
      // Apply the saved dawn/dusk theme before first paint (no flash). Storage may be blocked.
      (function () {
        var t = null;
        try { t = localStorage.getItem('ss.theme'); } catch (e) {}
        if (!t) { try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dusk' : 'dawn'; } catch (e) { t = 'dawn'; } }
        if (t === 'dusk') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>

    <div id="root"></div>
    <noscript>
      <div style="max-width:640px;margin:48px auto;padding:0 16px;font-family:Georgia,serif">
