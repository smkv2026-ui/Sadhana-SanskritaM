name: PR preview

# Optional: a temporary preview URL per pull request on Firebase Hosting preview channels
# (free on the Spark plan). Runs only when the FIREBASE_SERVICE_ACCOUNT secret exists and the PR
# comes from this repository (forks never receive secrets). Otherwise it is skipped — CI still runs.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_SA != 'true' || github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::Preview skipped (no FIREBASE_SERVICE_ACCOUNT secret, or PR from a fork)."
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true' && github.event.pull_request.head.repo.full_name == github.repository
      - uses: actions/setup-node@v7
        if: env.HAS_SA == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          node-version: 22
          cache: npm
      - name: Build (base path /)
        if: env.HAS_SA == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm ci && npm run build
        env:
          BASE_PATH: /
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_UPI_VPA: ${{ vars.VITE_UPI_VPA }}
          VITE_UPI_PAYEE_NAME: ${{ vars.VITE_UPI_PAYEE_NAME }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_SA == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          expires: 7d
