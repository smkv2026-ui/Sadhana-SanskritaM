name: Deploy

# Every push to main: full CI → build → publish to GitHub Pages (free, public URL).
# If the FIREBASE_SERVICE_ACCOUNT secret exists, Firestore rules + indexes are deployed too.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build site
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Base path is "/<repo>/" on github.io, "/" on a custom domain.
          BASE_PATH: ${{ vars.BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
          VITE_SITE_URL: ${{ vars.SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}
          # Firebase web config — public by design (Security Rules are the protection).
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_BACKEND: ${{ vars.VITE_BACKEND }}
          # Payments & contact
          VITE_UPI_VPA: ${{ vars.VITE_UPI_VPA }}
          VITE_UPI_PAYEE_NAME: ${{ vars.VITE_UPI_PAYEE_NAME }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_WHATSAPP: ${{ vars.VITE_CONTACT_WHATSAPP }}
          VITE_WHATSAPP_CHANNEL_URL: ${{ vars.VITE_WHATSAPP_CHANNEL_URL }}
          VITE_ADMIN_ALERT_EMAIL: ${{ vars.VITE_ADMIN_ALERT_EMAIL }}
          # EmailJS (public browser key by design; restrict it to your domain in EmailJS)
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_MONTHLY_QUOTA: ${{ vars.VITE_EMAILJS_MONTHLY_QUOTA }}
          # Provider switches / feature flags (optional)
          VITE_PAYMENT_PROVIDER: ${{ vars.VITE_PAYMENT_PROVIDER }}
          VITE_EMAIL_PROVIDER: ${{ vars.VITE_EMAIL_PROVIDER }}
          VITE_WHATSAPP_PROVIDER: ${{ vars.VITE_WHATSAPP_PROVIDER }}
          VITE_ACCESS_PROVIDER: ${{ vars.VITE_ACCESS_PROVIDER }}
          VITE_FLAG_INTRO: ${{ vars.VITE_FLAG_INTRO }}
          VITE_FLAG_ASSISTANT: ${{ vars.VITE_FLAG_ASSISTANT }}
          VITE_FLAG_AMBIENT: ${{ vars.VITE_FLAG_AMBIENT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  firestore-rules:
    name: Deploy Firestore rules & indexes (optional)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice
        if: env.HAS_SA != 'true' || env.PROJECT_ID == ''
        run: |
          echo "::notice::FIREBASE_SERVICE_ACCOUNT secret or VITE_FIREBASE_PROJECT_ID variable not set — skipping rules deploy."
          echo "::notice::Paste firestore.rules into Firebase console → Firestore → Rules instead (see README)."
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true' && env.PROJECT_ID != ''
        with:
          node-version: 22
      - name: Deploy rules + indexes
        if: env.HAS_SA == 'true' && env.PROJECT_ID != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@15 deploy --only firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
